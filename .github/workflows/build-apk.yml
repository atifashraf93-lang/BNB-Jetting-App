name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android licenses and install platform
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BNB-Jetting-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release and keep a copy on the apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/BNB-Jetting.apk
          gh release create "v1.5-${{ github.run_number }}" /tmp/BNB-Jetting.apk --title "BNB Jetting APK (build ${{ github.run_number }})" --notes "Debug APK built from commit ${{ github.sha }}" || true
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -q --orphan apk
          git rm -rfq .
          cp /tmp/BNB-Jetting.apk .
          git add BNB-Jetting.apk
          git commit -qm "APK build ${{ github.run_number }}"
          git push -f origin apk
        env:
          GH_TOKEN: ${{ github.token }}
