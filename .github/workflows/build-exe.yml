name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/build-exe.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build portable exe
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - name: Release and exe branch
        shell: bash
        run: |
          cp desktop/dist/BNB-Jetting.exe /tmp/BNB-Jetting.exe || cp desktop/dist/*.exe /tmp/BNB-Jetting.exe
          ls -la /tmp/BNB-Jetting.exe
          gh release create "exe-1.5-${{ github.run_number }}" /tmp/BNB-Jetting.exe --title "BNB Jetting for Windows (build ${{ github.run_number }})" --notes "Portable exe, no install needed" || true
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -q --orphan exe
          git rm -rfq .
          cp /tmp/BNB-Jetting.exe .
          git add BNB-Jetting.exe
          git commit -qm "EXE build ${{ github.run_number }}"
          git push -f origin exe
        env:
          GH_TOKEN: ${{ github.token }}
